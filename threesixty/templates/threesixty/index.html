{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Anupam 360</title>
  <link rel="icon" type="image/png" href="{% static 'images/logo.webp' %}">
  <link rel="stylesheet" href="{% static 'threesixty/vendor/leaflet/leaflet.css' %}">
  <link rel="stylesheet" href="{% static 'threesixty/css/ref.css' %}">
  <link rel="stylesheet" href="{% static 'threesixty/css/legacy.css' %}">
  <script>
    window.THREESIXTY_VENDOR = {
      leaflet: "{% static 'threesixty/vendor/leaflet/leaflet.js' %}",
      xlsx: "{% static 'threesixty/vendor/xlsx/xlsx.full.min.js' %}",
    };
  </script>
</head>
<body>
  <!-- Same structure as the reference app: mobile top bar, off-canvas sidebar, main column with the bell top-right. -->
  <div class="app-shell" id="app-shell">
    <div class="mobile-topbar" id="mobileTopbar">
      <button class="hamburger-btn" id="topbarBurger" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="logo-row brand-360 sm" aria-label="Anupam 360">360</div>
      <div class="notif-bell-wrap" id="notifBellWrapMobile" style="margin-left:auto;">
        <button type="button" class="notif-bell-btn" id="notifBellBtnMobile" title="Notifications" style="width:32px; height:32px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="notif-badge" id="notifBadgeMobile" style="display:none;"></span>
        </button>
        <div class="notif-dropdown" id="notifDropdownMobile" style="right:-8px;">
          <div class="notif-dropdown-head"><span>Notifications</span><button type="button" class="link-btn" id="notifMarkAllBtnMobile">Mark all read</button></div>
          <div id="notifListMobile"></div>
        </div>
      </div>
      <button class="hamburger-btn" id="mobileLogoutBtn" aria-label="Logout" style="font-size:15px;">&#9211;</button>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="app-sidebar">
      <div class="logo-row brand-360" aria-label="Anupam 360">360</div>
      <div class="nav-group">
        <div class="nav-label">Dashboard</div>
        <button class="nav-item" data-view="dashboard" id="navDashboard"><span>Dashboard</span><span class="nav-badge" id="dashBadge" style="display:none;"></span></button>
        <button class="nav-item" data-view="tasks" id="navTasks"><span>Task</span><span class="nav-badge" id="taskBadge" style="display:none;"></span></button>
        <button class="nav-item" data-view="callinglist" id="navCallingList"><span>Outreach</span><span class="nav-badge" id="callingListBadge" style="display:none;"></span></button>
        <button class="nav-item" data-view="attendance" id="navAttendance"><span>Attendance</span><span class="nav-badge" id="attBadge" style="display:none;"></span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Vendors</div>
        <button class="nav-item" data-view="customers" id="navCustomers"><span>Customer</span></button>
        <button class="nav-item" data-view="map" id="navMap"><span>Map &amp; Nearby</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Sales</div>
        <button class="nav-item" data-view="sales" data-subtab="enquiry" id="navEnquiry"><span>Enquiry</span><span class="nav-badge" id="navBadgeEnquiry" style="display:none;"></span></button>
        <button class="nav-item" data-view="sales" data-subtab="quotation" id="navQuotation"><span>Quotation</span><span class="nav-badge" id="navBadgeQuotation" style="display:none;"></span></button>
        <button class="nav-item" data-view="sales" data-subtab="proforma" id="navProforma"><span>Proforma Invoice</span><span class="nav-badge" id="navBadgeProforma" style="display:none;"></span></button>
        <button class="nav-item" data-view="sales" data-subtab="dc" id="navDC"><span>Delivery Challan</span><span class="nav-badge" id="navBadgeDC" style="display:none;"></span></button>
        <button class="nav-item" data-view="sales" data-subtab="po" id="navPO"><span>Pending PO</span><span class="nav-badge" id="navBadgePO" style="display:none;"></span></button>
        <button class="nav-item" data-view="payments" id="navPayments"><span>Payment Collection</span><span class="nav-badge" id="navBadgePayments" style="display:none;"></span></button>
        <button class="nav-item" data-view="labels" id="navLabels"><span>Print Label</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Insights</div>
        <button class="nav-item" data-view="reports" id="navReports"><span>Reports</span></button>
      </div>
      <div class="nav-group">
        <button class="nav-item" data-view="managelists" id="navManage"><span>Manage lists</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Main panel</div>
        <button class="nav-item" data-view="import" id="navImport"><span>Import Excel</span></button>
        <button class="nav-item" data-view="backup" id="navBackup"><span>Backup &amp; restore</span></button>
        <button class="nav-item" data-view="users" id="navUsers"><span>Users</span></button>
        <button class="nav-item" data-view="branches" id="navBranches"><span>Branch</span></button>
      </div>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="curAvatar">--</div>
          <div>
            <div class="name" id="curName">--</div>
            <div class="role" id="curRole">--</div>
          </div>
        </div>
        <button class="btn" id="logoutBtn" style="width:100%; justify-content:center; margin-top:10px;">
          <span style="font-size:14px;">&#9211;</span> Logout
        </button>
        <button class="link-btn" id="switchUserBtn" style="display:block; text-align:center; width:100%; margin-top:8px;">Switch user</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="app-topbar">
        <div class="notif-bell-wrap" id="notifBellWrap">
          <button type="button" class="notif-bell-btn" id="notifBellBtn" title="Notifications">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="notif-badge" id="notifBadge" style="display:none;"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-dropdown-head"><span>Notifications</span><button type="button" class="link-btn" id="notifMarkAllBtn">Mark all read</button></div>
            <div id="notifList"></div>
          </div>
        </div>
      </div>
      <div id="app-view"><div class="empty">Loading…</div></div>
    </main>
  </div>

  <script>window.THREESIXTY_USER = {{ profile.user.id }};</script>
  <script type="module" src="{% static 'threesixty/js/app.js' %}"></script>
</body>
</html>
